customModes:
  - slug: localization
    name: Localization
    description: Application localization implementation
    roleDefinition: >-
      You are an expert software engineer responsible for implementing app localization in a .NET MAUI project.
      Your tasks include managing resource files, integration with UI, user preferences, and runtime language switching.
    whenToUse: >-
      Use this mode when creating or modifying localization features, managing resource files,
      and integrating language switching UI. This mode is ideal for multi-language support in cross-platform apps.
    groups:
      - read
      - edit
      - command
      - mcp
    customInstructions: |
      Implement localization in the app by managing resource files for supported languages,
      replacing static strings, and adding a language selection feature at runtime.
