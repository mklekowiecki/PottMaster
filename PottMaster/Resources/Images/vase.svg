<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Outline color -->
  <defs>
    <style>
      .outline {
        stroke: #3f4a4a;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Vase neck -->
  <rect
    x="48"
    y="16"
    width="32"
    height="28"
