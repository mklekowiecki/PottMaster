name: CI/CD Pipeline

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0

      - name: Install MAUI Workloads
        run: dotnet workload restore

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test --no-restore --verbosity normal

  build:
    name: Build Production
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0

      - name: Install MAUI Workloads
        run: dotnet workload restore

      - name: Restore Dependencies
        run: dotnet restore

      - name: Publish Application
        run: dotnet publish PottMaster/PottMaster.csproj -c Release -f net9.0-android -o ./output

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: ./output